  <text x="410" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#d97706">报文②  服务器 → 客户端   （ACK = 1，确认收到 FIN）</text>

  <text x="40" y="442" text-anchor="middle" font-size="12">0</text>
  <text x="395" y="442" text-anchor="middle" font-size="12">15 16</text>

  <text x="405" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">seq = 8000  （记为 v，服务器此时还没发 FIN，序号不变）</text>

  <rect x="40" y="550" width="730" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="572" text-anchor="middle" font-size="13">32 位确认序号 (Acknowledgment Number)</text>

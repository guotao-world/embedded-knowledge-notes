  <text x="410" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">报文①  客户端 → 服务器   （FIN = 1，ACK = 1，主动关闭）</text>

  <text x="40" y="42" text-anchor="middle" font-size="12">0</text>
  <text x="395" y="42" text-anchor="middle" font-size="12">15 16</text>
  <text x="770" y="42" text-anchor="middle" font-size="12">31</text>

  <rect x="40" y="50" width="355" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="395" y="50" width="375" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="217" y="72" text-anchor="middle" font-size="13">16 位源端口号</text>
  <text x="217" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">54321</text>
  <text x="582" y="72" text-anchor="middle" font-size="13">16 位目的端口号</text>
  <text x="582" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">80</text>

  <rect x="40" y="100" width="730" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="122" text-anchor="middle" font-size="13">32 位序号 (Sequence Number)</text>
  <text x="405" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">seq = 2000  （记为 u，客户端下次要发的字节序号）</text>

  <rect x="40" y="150" width="730" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="172" text-anchor="middle" font-size="13">32 位确认序号 (Acknowledgment Number)</text>
  <text x="405" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">ack = 8000  （记为 v，确认收到了服务器发来的 8000 号之前的字节）</text>

  <rect x="40" y="200" width="70" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="110" y="200" width="90" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
